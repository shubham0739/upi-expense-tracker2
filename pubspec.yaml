name: upi_expense_tracker
description: A UPI-first expense tracker for Android. Launch your UPI app, pay, come back, and log what it was for.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # State management
  provider: ^6.1.2
  # Formatting & charts
  intl: ^0.19.0
  fl_chart: ^0.69.0
  # Android integrations
  url_launcher: ^6.3.0
  android_intent_plus: ^5.2.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
